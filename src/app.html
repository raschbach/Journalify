<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#12100e" media="(prefers-color-scheme: dark)" />
		<meta name="color-scheme" content="light dark" />
		<meta
			name="description"
			content="Journalify – dein persönliches Logbuch für Filme, Bücher, Musik, Konzerte und mehr."
		/>
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Journalify" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
